<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123f3b"><meta name="description" content="جذر، رحلة عربية إلى أصول الكلمات. تحدٍّ يومي وتدريب ومستوى النخبة.">
<title>جذر — لكل كلمة حكاية</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23123f3b'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-size='42' fill='%23ead4a3'%3Eج%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20261009-5">
<script defer src="js/game.js?v=20261009-5"></script><script defer src="js/storage.js?v=20261009-5"></script><script defer src="js/audio.js?v=20261009-5"></script><script defer src="js/ui.js?v=20261009-5"></script>
<script defer src="js/wordgame.js?v=20261009-5"></script><script defer src="js/wordstorage.js?v=20261009-5"></script><script defer src="js/wordui.js?v=20261009-5"></script>
<script defer src="js/sources.js?v=20261009-5"></script>
</head>
<body>
<svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
<symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H3Z M9 20v-7h6v7"/></symbol>
<symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4Z M17 8q5 4 0 8 M19 4q9 8 0 16"/></symbol>
<symbol id="i-stats" viewBox="0 0 24 24"><path d="M5 20V12M12 20V4M19 20V8"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="8" cy="18" r="2"/></symbol>
<symbol id="i-backspace" viewBox="0 0 24 24"><path d="m3 12 6-7h12v14H9Z M12 9l6 6m0-6-6 6"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5L20 6"/></symbol>
<symbol id="i-share" viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M5 13v7h14v-7"/></symbol>
<symbol id="i-next" viewBox="0 0 24 24"><path d="M20 12H4m6-6-6 6 6 6"/></symbol>
<symbol id="i-book" viewBox="0 0 24 24"><path d="M12 5C8 2 4 3 2 4v15c4-2 7-1 10 1 3-2 6-3 10-1V4c-2-1-6-2-10 1Zm0 0v15"/></symbol>
</defs></svg>
<div class="ambient-pattern" aria-hidden="true"></div>
<div class="site-shell">
<header class="header"><button id="home-button" class="brand" aria-label="العودة إلى اختيار اللعبة">حروف<span>✦</span></button><div class="header-actions">
<button id="sound-button" class="icon-button" aria-label="كتم الصوت" aria-pressed="true"><svg aria-hidden="true"><use href="#i-sound"/></svg></button>
<button id="stats-button" class="icon-button" aria-label="إحصاءات اللعبة"><svg aria-hidden="true"><use href="#i-stats"/></svg></button>
<button id="settings-button" class="icon-button" aria-label="الإعدادات"><svg aria-hidden="true"><use href="#i-settings"/></svg></button>
<button id="help-button" class="icon-button help" aria-label="قواعد اللعبة">؟</button>
</div></header>
<main>
<section id="welcome-screen" class="welcome" aria-labelledby="welcome-title"><div class="home-emblem" aria-hidden="true">ض</div><h1 id="welcome-title">اختر حكايتك</h1>
<div class="game-choices"><button id="start-daily" class="game-choice" disabled aria-label="لعبة جذر، اكتشف الجذر الثلاثي"><span class="choice-art" aria-hidden="true">ج</span><strong>جذر</strong><small>٣ أحرف</small></button><button id="wordgame-launch" class="game-choice indigo" disabled aria-label="لعبة الأحرف الخمسة"><span class="choice-art" aria-hidden="true">ك</span><strong id="wordgame-name"></strong><small>٥ أحرف</small></button></div><p id="welcome-status" class="status" role="status">تحميل…</p></section>
<section id="game-screen" hidden aria-label="لعبة الجذور"><div class="game-topline"><button id="back-home" class="icon-button" aria-label="العودة إلى البداية"><svg aria-hidden="true"><use href="#i-home"/></svg></button><nav class="modes" aria-label="نمط اللعب"><button id="daily-mode" disabled aria-pressed="true">يومي</button><button id="practice-mode" disabled aria-pressed="false">تدريب</button></nav><span class="game-name">جذر</span></div>
<div class="game-card"><div id="practice-options" class="practice-options levels" hidden role="group" aria-label="صعوبة التدريب"><button id="level-1" aria-pressed="true" aria-label="المستوى السهل">سهل</button><button id="level-2" aria-pressed="false" aria-label="المستوى المتوسط">متوسط</button><button id="level-3" aria-pressed="false" aria-label="المستوى المتقدم">متقدم</button><button id="level-4" aria-pressed="false" aria-label="مستوى النخبة">نخبة</button></div>
<section class="puzzle" aria-labelledby="word"><div class="round-meta"><span id="round-label"></span><span id="difficulty"></span></div><h2 id="word" tabindex="-1">…</h2><div id="board" class="board" role="group" aria-label="محاولات تخمين الجذر"></div><p id="message" class="message" role="status" aria-live="polite">تحميل…</p><div id="hints" class="hints" aria-live="polite"></div></section>
<section id="keyboard" class="keyboard" aria-label="لوحة الحروف العربية"></section>
<div class="play-actions"><button id="submit-guess" class="primary" disabled aria-label="تأكيد الجذر"><svg aria-hidden="true"><use href="#i-check"/></svg>تأكيد</button><button id="delete-letter" class="secondary" disabled aria-label="حذف آخر حرف"><svg aria-hidden="true"><use href="#i-backspace"/></svg>حذف</button><button id="clear-guess" class="icon-button" disabled aria-label="مسح جميع الحروف">×</button></div>
<div class="result-actions" id="result-actions" hidden><button id="share-button" class="primary" aria-label="مشاركة النتيجة"><svg aria-hidden="true"><use href="#i-share"/></svg>مشاركة</button><button id="next-button" class="secondary" hidden aria-label="كلمة تدريب جديدة"><svg aria-hidden="true"><use href="#i-next"/></svg>التالي</button><div id="root-story" class="root-story"></div></div></div></section>
<section id="wordgame-screen" hidden aria-label="لعبة الأحرف الخمسة"><div class="game-topline"><button id="wg-home" class="icon-button" aria-label="العودة إلى اختيار اللعبة"><svg aria-hidden="true"><use href="#i-home"/></svg></button><nav class="modes" aria-label="نمط لعبة الأحرف الخمسة"><button id="wg-daily" aria-pressed="true">يومي</button><button id="wg-practice" aria-pressed="false">تدريب</button></nav><span id="wg-name" class="game-name"></span></div><div class="game-card"><div class="puzzle"><div class="round-meta"><span id="wg-round"></span><span class="badge">٥ أحرف</span></div><h2 id="wg-title" class="sr-only" tabindex="-1">خمّن الكلمة المخفية</h2><div id="wg-board" class="board" role="group" aria-label="محاولات تخمين الكلمة"></div><p id="wg-message" class="message" role="status" aria-live="polite"></p></div><section id="wg-keyboard" class="keyboard" aria-label="لوحة حروف الكلمة"></section><div id="wg-play" class="play-actions"><button id="wg-submit" class="primary" aria-label="تأكيد الكلمة"><svg aria-hidden="true"><use href="#i-check"/></svg>تأكيد</button><button id="wg-delete" class="secondary" aria-label="حذف آخر حرف"><svg aria-hidden="true"><use href="#i-backspace"/></svg>حذف</button><button id="wg-clear" class="icon-button" aria-label="مسح حروف الكلمة">×</button></div><div id="wg-results" class="result-actions" hidden><button id="wg-share" class="primary" aria-label="مشاركة نتيجة الكلمة"><svg aria-hidden="true"><use href="#i-share"/></svg>مشاركة</button><button id="wg-next" class="secondary" aria-label="كلمة تدريب جديدة"><svg aria-hidden="true"><use href="#i-next"/></svg>التالي</button></div></div></section>
<div class="load-recovery"><p id="wg-load-status" class="status" role="status" hidden></p><button id="wg-retry" class="secondary" aria-label="إعادة تحميل لعبة الأحرف الخمسة" hidden>إعادة</button></div><div class="load-recovery"><button id="retry-load" class="secondary" hidden aria-label="إعادة تحميل الكلمات">إعادة</button></div>
</main><footer><span aria-hidden="true">✦</span><p id="storage-note" class="storage-note" hidden role="status">الحفظ غير متاح</p></footer></div>
<dialog id="settings-dialog" aria-labelledby="settings-title"><div class="dialog-header"><h2 id="settings-title">الإعدادات</h2><button class="close-dialog icon-button" aria-label="إغلاق الإعدادات">×</button></div><label class="preference"><input id="color-blind" type="checkbox">تمييز بالأشكال</label><label class="preference"><input id="reduce-motion" type="checkbox">إيقاف الحركة</label></dialog>
<dialog id="help-dialog" aria-labelledby="help-title"><div class="dialog-header"><h2 id="help-title">القواعد</h2><button class="close-dialog icon-button" aria-label="إغلاق القواعد">×</button></div><div id="rules-content"><p>اكتشف الجذر بثلاثة أحرف، في ست محاولات.</p><p>● صحيح · ▲ مكان آخر · × غير موجود.</p><p>الوزن بعد محاولتين، والمعنى بعد أربع.</p><p>اليومي يتجدّد منتصف الليل بالتوقيت العالمي.</p></div></dialog>
<dialog id="stats-dialog" aria-labelledby="stats-title"><div class="dialog-header"><h2 id="stats-title">إنجازاتك</h2><button class="close-dialog icon-button" aria-label="إغلاق الإحصاءات">×</button></div><div id="stats-content"></div></dialog>
<dialog id="share-dialog" aria-labelledby="share-title"><div class="dialog-header"><h2 id="share-title">مشاركة</h2><button class="close-dialog icon-button" aria-label="إغلاق المشاركة">×</button></div><textarea id="share-text" readonly dir="rtl" aria-label="انسخ نص النتيجة للمشاركة"></textarea></dialog>
<button id="sources-button" class="icon-button sources-button" aria-label="المصادر والتراخيص"><svg aria-hidden="true"><use href="#i-book"/></svg></button>
<dialog id="sources-dialog" aria-labelledby="sources-title"><div class="dialog-header"><h2 id="sources-title">المصادر</h2><button class="close-dialog icon-button" aria-label="إغلاق المصادر">×</button></div><div id="sources-content" aria-live="polite"></div><button id="sources-retry" class="secondary" hidden aria-label="إعادة تحميل المصادر">إعادة</button></dialog>
<noscript><p>فعّل جافاسكربت للعب.</p></noscript></body></html>
